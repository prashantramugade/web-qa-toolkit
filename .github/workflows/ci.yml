name: cross-platform check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regression check (seeded defects)
        run: npm run check
      - name: End-to-end (crawl, scaffold, run suite, report, package)
        run: npm run e2e
        env:
          KEEP_E2E_OUT: '1'
      - name: Upload results (report, screenshots, generated suite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-e2e-${{ matrix.os }}
          path: |
            qa-out-e2e
            !qa-out-e2e/suite/node_modules
          if-no-files-found: warn
          retention-days: 14
